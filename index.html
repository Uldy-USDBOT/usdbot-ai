<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USDBOT.AI — Premium Domain For Sale</title>
    <meta name="description" content="USDBOT.AI is a premium AI domain for sale. Own the future of AI-powered finance. Send your offer now.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #060810;
            --gold: #f0c060;
            --gold-bright: #f7d680;
            --cyan: #4da8da;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f0f5;
            --text-secondary: #b0b0c0;
            --text-muted: #787890;
            --whatsapp-green: #25d366;
            --radius-xl: 32px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ─── Animated 3D Background Grid ─── */
        .cyber-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(77, 168, 218, 0.06) 1px, transparent 1px),
                linear-gradient(90deg, rgba(77, 168, 218, 0.06) 1px, transparent 1px);
            background-size: 60px 60px;
            perspective: 500px;
            transform: rotateX(60deg);
            animation: gridScroll 20s linear infinite;
        }
        @keyframes gridScroll {
            0% {
                background-position: 0px 0px;
            }
            100% {
                background-position: 0px 60px;
            }
        }

        /* ─── Ambient Light Orbs ─── */
        .light-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
        }
        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(240, 192, 96, 0.3) 0%, transparent 70%);
            top: -20%;
            left: -15%;
        }
        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(77, 168, 218, 0.25) 0%, transparent 70%);
            bottom: -15%;
            right: -10%;
        }
        .orb-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.2) 0%, transparent 70%);
            top: 40%;
            left: 40%;
            transform: translate(-50%, -50%);
        }

        /* ─── Floating Particles ─── */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 15px var(--gold);
            animation: float linear infinite;
            opacity: 0;
        }
        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }

        /* ─── Main Layout ─── */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            width: 90%;
            max-width: 800px;
            padding: 20px;
        }

        /* ─── 3D Robot & Dollar Visual ─── */
        .visual-hero {
            position: relative;
            width: 100%;
            height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: -20px;
            z-index: 20;
        }

        /* Robot Arm CSS (Realistic 3D Construct) */
        .robot-arm {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-30px);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: armPulse 4s ease-in-out infinite;
        }
        @keyframes armPulse {
            0%,
            100% {
                transform: translateX(-30px) translateY(0);
            }
            50% {
                transform: translateX(-30px) translateY(-8px);
            }
        }
        .arm-base {
            width: 40px;
            height: 15px;
            background: linear-gradient(180deg, #3a404a 0%, #1c1f26 100%);
            border-radius: 8px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.6);
        }
        .arm-joint {
            width: 30px;
            height: 30px;
            background: radial-gradient(circle at 30% 30%, #5a6575, #1c1f26);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(77, 168, 218, 0.5), inset 0 2px 5px rgba(255, 255, 255, 0.3);
            margin: -4px 0;
        }
        .arm-segment {
            width: 18px;
            height: 55px;
            background: linear-gradient(90deg, #2a303a 0%, #4a5363 50%, #1c1f26 100%);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        .arm-gripper {
            display: flex;
            gap: 4px;
            margin-top: -2px;
        }
        .gripper-finger {
            width: 8px;
            height: 35px;
            background: linear-gradient(90deg, #4a5363, #1c1f26);
            border-radius: 4px 4px 6px 6px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            animation: grip 2s ease-in-out infinite;
        }
        .gripper-finger:nth-child(2) {
            animation-delay: 0.15s;
        }
        .gripper-finger:nth-child(3) {
            animation-delay: 0.3s;
        }
        @keyframes grip {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(3px);
            }
        }

        /* 3D Glass Dollar Bill */
        .dollar-scene {
            width: 140px;
            height: 160px;
            perspective: 800px;
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 25;
        }
        .dollar-3d {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateDollar 12s infinite linear;
        }
        @keyframes rotateDollar {
            0% {
                transform: rotateY(0deg) rotateX(10deg);
            }
            100% {
                transform: rotateY(360deg) rotateX(10deg);
            }
        }
        .dollar-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(240, 192, 96, 0.3);
        }
        .front {
            background: linear-gradient(135deg, rgba(26, 35, 26, 0.9), rgba(10, 20, 10, 0.9));
            border: 1px solid rgba(240, 192, 96, 0.4);
            backdrop-filter: blur(4px);
            color: var(--gold);
            font-family: 'Orbitron', monospace;
            font-size: 4rem;
            font-weight: 800;
            text-shadow: 0 0 25px rgba(240, 192, 96, 0.8);
        }
        .back {
            background: linear-gradient(135deg, rgba(30, 25, 25, 0.9), rgba(15, 10, 10, 0.9));
            border: 1px solid rgba(240, 192, 96, 0.2);
            transform: rotateY(180deg);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 10px;
        }
        .back-pattern {
            width: 80%;
            height: 4px;
            background: var(--gold);
            opacity: 0.6;
            border-radius: 2px;
            box-shadow: 0 0 10px var(--gold);
        }
        .left,
        .right {
            width: 40px;
            background: linear-gradient(180deg, #0a1a0a, #051005);
            border: 1px solid rgba(240, 192, 96, 0.3);
            transform: rotateY(-90deg) translateZ(70px);
        }
        .right {
            transform: rotateY(90deg) translateZ(100px);
        }
        .top,
        .bottom {
            height: 40px;
            width: 100%;
            background: linear-gradient(180deg, #0a1a0a, #051005);
            border: 1px solid rgba(240, 192, 96, 0.3);
            transform: rotateX(90deg) translateZ(80px);
        }
        .bottom {
            transform: rotateX(-90deg) translateZ(80px);
        }

        /* Hologram effect */
        .hologram {
            position: absolute;
            inset: 0;
            border-radius: 12px;
            animation: hologramGlow 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 26;
        }
        @keyframes hologramGlow {
            0%,
            100% {
                box-shadow: inset 0 0 30px rgba(77, 168, 218, 0.2);
                opacity: 0.6;
            }
            50% {
                box-shadow: inset 0 0 60px rgba(77, 168, 218, 0.5);
                opacity: 1;
            }
        }

        /* ─── Glass Card ─── */
        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 40px rgba(240, 192, 96, 0.08);
            padding: 50px 40px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 20;
            animation: cardReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes cardReveal {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(240, 192, 96, 0.08);
            border: 1px solid rgba(240, 192, 96, 0.25);
            border-radius: 50px;
            padding: 8px 20px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold-bright);
            margin-bottom: 28px;
        }
        .badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gold);
            box-shadow: 0 0 12px var(--gold);
            animation: dotPulse 2s infinite;
        }
        @keyframes dotPulse {
            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(1.8);
            }
        }

        .domain-name {
            font-family: 'Orbitron', 'Inter', monospace;
            font-weight: 900;
            font-size: clamp(2.6rem, 7vw, 4.5rem);
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #f0c060 0%, #e0a840 40%, #f7d680 70%, #d49430 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            line-height: 1.1;
        }
        .tagline {
            font-size: 1.05rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 20px;
        }

        .divider-line {
            width: 50px;
            height: 3px;
            background: var(--gold);
            border-radius: 4px;
            margin: 0 auto 24px;
            opacity: 0.8;
        }

        .feature-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 32px;
        }
        .feature-pill {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 10px 18px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 7px;
            transition: 0.3s;
        }
        .feature-pill:hover {
            border-color: var(--gold);
            background: rgba(240, 192, 96, 0.05);
            color: var(--gold-bright);
            box-shadow: 0 0 20px rgba(240, 192, 96, 0.15);
        }

        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--whatsapp-green);
            color: #fff;
            font-weight: 700;
            font-size: 1.2rem;
            padding: 18px 42px;
            border-radius: 60px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 35px rgba(37, 211, 102, 0.35);
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
        }
        .cta-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, transparent 60%);
            pointer-events: none;
        }
        .cta-btn:hover {
            background: #20ba5a;
            box-shadow: 0 16px 45px rgba(37, 211, 102, 0.5);
            transform: translateY(-3px);
        }
        .cta-btn:active {
            transform: translateY(0);
        }
        .whatsapp-num {
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
        }
        .whatsapp-num span {
            color: var(--text-secondary);
            font-weight: 600;
        }
        .trust-strip {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }
        .trust-item {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .trust-item .icon {
            color: var(--cyan);
        }

        @media (max-width: 600px) {
            .glass-card {
                padding: 30px 20px;
                border-radius: 24px;
            }
            .domain-name {
                font-size: 2.4rem;
            }
            .visual-hero {
                height: 260px;
            }
            .dollar-scene {
                width: 100px;
                height: 120px;
            }
            .front {
                font-size: 2.8rem;
            }
            .left,
            .right {
                width: 30px;
            }
            .top,
            .bottom {
                height: 30px;
            }
            .cta-btn {
                padding: 14px 30px;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <script>
        // Generate floating particles
        (function() {
            const container = document.getElementById('particles');
            const colors = ['#f0c060', '#4da8da', '#f7d680', '#8b5cf6', '#5ee0d0'];
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 3 + 1.5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = Math.random() * 8 + 6 + 's';
                particle.style.animationDelay = Math.random() * 6 + 's';
                container.appendChild(particle);
            }
        })();
    </script>
